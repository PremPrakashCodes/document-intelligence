[project]
name = "document-intelligence"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.3",
    "alembic>=1.19.1",
    "azure-ai-documentintelligence>=1.0.2",
    "boto3>=1.43.86",
    "bullmq[postgres]>=3.2.1",
    "fastapi[standard]>=0.141.1",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "sqlalchemy[asyncio]>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api", "src/db", "src/extraction", "src/jobs", "src/storage"]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::DeprecationWarning:extraction.*", "error::DeprecationWarning:api.*"]
