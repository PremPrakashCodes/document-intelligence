<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GI Dashboard</title>
    <script>
      // shadcn themes off a `.dark` class; follow the OS setting.
      // Inline and before paint so there is no flash of the wrong theme.
      ;(function () {
        var query = matchMedia('(prefers-color-scheme: dark)')
        function apply() {
          document.documentElement.classList.toggle('dark', query.matches)
          document.documentElement.style.colorScheme = query.matches
            ? 'dark'
            : 'light'
        }
        apply()
        query.addEventListener('change', apply)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
